<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>(function(){try{var t=localStorage.getItem('observatory-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ratul Hasan Ruhan</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070B1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/observatory.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars-day"></div></div>

<header class="mast">
  <div class="mast-inner">
    <a class="brand" href="/">Observatory<small>Ratul Hasan Ruhan</small></a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>

</header>

    <p class="kicker">404</p>

    <div class="cta-row">
      <a class="btn btn-primary" href="/">Back to the observatory</a>
      <a class="btn" href="/#contact">Contact</a>

  </section>

<script src="/assets/js/observatory.js"></script>

</html>
